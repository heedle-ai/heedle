# GoReleaser (v2) builds heedle for the platforms heedle supports, makes
# a GitHub release of heedle-ai/heedle, and pushes a Homebrew cask to
# heedle-ai/homebrew-tap. Both repositories are public: the cask
# downloads the release's archive with Homebrew's own download.
# CI checks this and builds a snapshot on every push; pushing a v* tag
# releases (.github/workflows/release.yml).
version: 2
project_name: heedle

builds:
  - main: .
    binary: heedle
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin # macOS on Apple Silicon only
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: heedle
    homepage: https://github.com/heedle-ai/heedle
    description: Programs of AI steps that run on Temporal and are recorded in Git.
    binaries: [heedle]
    repository:
      owner: heedle-ai
      name: homebrew-tap
      git:
        url: git@github.com:heedle-ai/homebrew-tap.git
        # A deploy key that may write to the tap, and nothing else.
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    url:
      template: "https://github.com/heedle-ai/heedle/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    dependencies:
      - formula: git
      - formula: podman
      - formula: temporal
    # A pre-release (v0.2.0-rc1) is released, but not pushed to the tap.
    skip_upload: auto
    custom_block: |
      # The binary isn't notarized; let macOS run it.
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "heedle"], chdir: ".", must_succeed: false
        end
      end

release:
  prerelease: auto

changelog:
  disable: true
