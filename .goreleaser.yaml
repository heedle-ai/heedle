# GoReleaser (v2) builds heedle for the platforms heedle supports, makes
# a GitHub release of heedle-ai/heedle, and pushes a Homebrew cask to
# heedle-ai/homebrew-tap. Both repositories are private: the cask
# downloads with the installer's own GitHub token (see custom_block).
# CI checks this and builds a snapshot on every push; pushing a v* tag
# releases (.github/workflows/release.yml).
version: 2
project_name: heedle

builds:
  - main: .
    binary: heedle
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin # macOS on Apple Silicon only
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: heedle
    homepage: https://github.com/heedle-ai/heedle
    description: Programs of AI steps that run on Temporal and are recorded in Git.
    binaries: [heedle]
    repository:
      owner: heedle-ai
      name: homebrew-tap
      git:
        url: git@github.com:heedle-ai/homebrew-tap.git
        # A deploy key that may write to the tap, and nothing else.
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    url:
      template: "https://github.com/heedle-ai/heedle/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      using: HeedlePrivateReleaseDownloadStrategy
    dependencies:
      - formula: git
      - formula: podman
      - formula: temporal
    # A pre-release (v0.2.0-rc1) is released, but not pushed to the tap.
    skip_upload: auto
    # The releases are private, so the cask downloads through GitHub's
    # REST API with the token in HOMEBREW_GITHUB_API_TOKEN, read when it
    # downloads. CurlDownloadStrategy, curl_output and curl_download are
    # Homebrew's own; Homebrew has no public API for this, so a Homebrew
    # update may need this adjusted.
    custom_block: |
      require "json"
      require "tempfile"

      unless defined?(HeedlePrivateReleaseDownloadStrategy)
        class HeedlePrivateReleaseDownloadStrategy < CurlDownloadStrategy
          private

          # Homebrew probes the URL before downloading; a private release's
          # URL answers 404 without a token, so take it as it is.
          def resolve_url_basename_time_file_size(url, timeout: nil)
            [url, File.basename(URI(url).path), nil, nil, nil, false]
          end

          def _fetch(url:, resolved_url:, timeout:)
            m = %r{\Ahttps://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/]+)\z}.match(url)
            raise "not a GitHub release asset: #{url}" unless m
            owner, repo, tag, file = m.captures
            token = ENV.fetch("HOMEBREW_GITHUB_API_TOKEN", "")
            if token.empty?
              token = begin
                IO.popen(["gh", "auth", "token"], err: File::NULL, &:read).to_s.strip
              rescue SystemCallError
                ""
              end
            end
            if token.empty?
              raise "heedle is private: sign in with gh auth login, or export HOMEBREW_GITHUB_API_TOKEN, then install again"
            end
            # The token goes to curl in a file only this user can read, not
            # in its arguments, which other users could see.
            Tempfile.create("heedle-auth") do |f|
              f.chmod(0600)
              f.write("Authorization: Bearer #{token}\nX-GitHub-Api-Version: 2022-11-28\n")
              f.flush
              api = "https://api.github.com/repos/#{owner}/#{repo}/releases"
              release = curl_output("--header", "@#{f.path}", "--fail", "--location", "--max-time", "60", "#{api}/tags/#{tag}")
              unless release.success?
                raise "can't read release #{tag} of #{owner}/#{repo}: does your GitHub token have access to it?"
              end
              asset = JSON.parse(release.stdout).fetch("assets", []).find { |a| a["name"] == file }
              raise "release #{tag} of #{owner}/#{repo} has no #{file}" unless asset
              curl_download("#{api}/assets/#{asset["id"]}", "--header", "@#{f.path}",
                            "--header", "Accept: application/octet-stream", to: temporary_path, timeout: timeout)
            end
          end
        end
      end

      # The binary isn't notarized; let macOS run it.
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "heedle"], chdir: ".", must_succeed: false
        end
      end

release:
  prerelease: auto

changelog:
  disable: true
