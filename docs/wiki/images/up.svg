<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>heedle up as a string diagram</title><desc>heedle up, given its home directory: on macOS it first makes sure Podman's virtual machine exists and runs; then it starts Temporal's dev server, keeping its database in the home directory; then, side by side, a loom worker and the drawdown UI, both using Temporal's address and the store in the home directory. The worker's runs are recorded in Git; you open the UI in a browser. Stopping heedle stops the UI and worker, then Temporal.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="d" x="70" y="60" width="540" height="320" rx="12"/><text class="l" x="74" y="50" text-anchor="start">heedle up</text>
<path class="w" d="M340 20 L340 90"/><text class="l" x="350" y="40" text-anchor="start">~/.heedle</text>
<g class="n"><rect x="220" y="90" width="240" height="48" rx="6"/><text class="t1" x="340.0" y="111" text-anchor="middle">podman machine</text><text class="t2" x="340.0" y="128" text-anchor="middle">macOS: init if none; start if stopped</text></g>
<path class="w" d="M340 138 L340 170"/><text class="f" x="350" y="160" text-anchor="start">;</text>
<g class="c"><rect x="220" y="170" width="240" height="48" rx="6"/><text class="t1" x="340.0" y="191" text-anchor="middle">Temporal dev server</text><text class="t2" x="340.0" y="208" text-anchor="middle">temporal on the PATH; temporal.db</text></g>
<path class="w" d="M340 218 L340 246"/><text class="l" x="350" y="238" text-anchor="start">address, store.git</text><circle class="dot" cx="340" cy="250" r="4.5"/>
<path class="w" d="M336 252 C 300 262, 220 258, 220 290"/><path class="w" d="M344 252 C 380 262, 460 258, 460 290"/>
<g class="g"><rect x="130" y="290" width="180" height="48" rx="6"/><text class="t1" x="220.0" y="311" text-anchor="middle">loom worker</text><text class="t2" x="220.0" y="328" text-anchor="middle">runs programs</text></g><text class="f" x="340" y="320" text-anchor="middle">⊗</text><g class="p"><rect x="370" y="290" width="180" height="48" rx="6"/><text class="t1" x="460.0" y="311" text-anchor="middle">drawdown UI</text><text class="t2" x="460.0" y="328" text-anchor="middle">127.0.0.1:8090</text></g>
<path class="w" d="M220 338 L220 420"/><text class="l" x="230" y="410" text-anchor="start">runs, recorded in Git</text>
<path class="w" d="M460 338 L460 420"/><text class="l" x="470" y="410" text-anchor="start">your browser</text>
</svg>