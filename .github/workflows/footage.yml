name: Footage

# Records footage for the product video on a real heedle up: real
# Temporal, real runs, drawdown and Temporal's Web UI. Lives only on the
# footage branch; uploads the videos as an artifact.

on:
  push:
    branches: [footage]

permissions:
  contents: write # pushes the footage to the footage-out branch

defaults:
  run:
    shell: bash

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: heedle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/loom
          path: loom
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/drawdown
          path: drawdown
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - name: private-bobbin
        # read-only deploy key on heedle-ai/bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
          ssh-key: ${{ secrets.BOBBIN_DEPLOY_KEY }}
      - name: private-reed
        # read-only deploy key on heedle-ai/reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
          ssh-key: ${{ secrets.REED_DEPLOY_KEY }}
      - name: private-pirn
        # read-only deploy key on heedle-ai/pirn
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/pirn
          path: pirn
          ssh-key: ${{ secrets.PIRN_DEPLOY_KEY }}
      - name: private-treadle
        # read-only deploy key on heedle-ai/treadle
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/treadle
          path: treadle
          ssh-key: ${{ secrets.TREADLE_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: heedle/go.mod
          cache-dependency-path: heedle/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tools
        working-directory: heedle
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          go build -o heedle .
      - name: up
        working-directory: heedle
        run: |
          ./heedle up -home "$RUNNER_TEMP/h" > up.log 2>&1 &
          for i in $(seq 1 120); do grep -q "drawdown on" up.log && break; sleep 1; done
          cat up.log
          grep -q "drawdown on" up.log
      - name: runs
        # Programs using the hello world's source and assess go through the
        # UI's API (its worker has them); the rest through heedle run.
        working-directory: heedle
        run: |
          submit() {
            body=$(jq -n --arg p "$1" '{program: $p}')
            id=$(curl -sSf -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8090' -d "$body" http://127.0.0.1:8090/api/runs | jq -r .workflowId)
            echo "submitted $id" | tee -a runs.log
            sleep 4
          }
          shipment='(pipe (par (source "weather") (source "carrier") (source "factory")) (assess "the shipment will be late"))'
          submit "$shipment"
          ./heedle run '(pipe (par (echo "port report") (echo "carrier notice")) echo)' | tee -a runs.log
          submit '(pipe (par (source "weather") (source "carrier")) (assess "the shipment will be late"))'
          ./heedle run '(pipe (echo "weekly digest") (par echo (echo "ops")) echo)' | tee -a runs.log
          submit "$shipment"
          ./heedle run '(pipe (par (echo "a") (echo "b") (echo "c")) (par echo (echo "d")) echo)' | tee -a runs.log
          submit '(pipe (par (source "weather") (source "carrier") (source "factory")) (assess "the factory is the bottleneck"))'
          submit "$shipment"
          sleep 5
      - name: record
        working-directory: heedle
        env:
          OUT: ${{ runner.temp }}/footage
        run: |
          node footage/record.js
          cp up.log runs.log "$OUT/"
          ls -R "$OUT"
      - name: publish
        # The footage goes to a throwaway branch, footage-out, so it can be
        # fetched with git.
        working-directory: ${{ runner.temp }}/footage
        run: |
          git init -q -b footage-out .
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Footage from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" footage-out
