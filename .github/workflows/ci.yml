name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step
    # (the default, bash -e, ignores it).
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: heedle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/loom
          path: loom
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/drawdown
          path: drawdown
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - name: private-bobbin
        # read-only deploy key on heedle-ai/bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
          ssh-key: ${{ secrets.BOBBIN_DEPLOY_KEY }}
      - name: private-reed
        # read-only deploy key on heedle-ai/reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
          ssh-key: ${{ secrets.REED_DEPLOY_KEY }}
      - name: private-pirn
        # read-only deploy key on heedle-ai/pirn
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/pirn
          path: pirn
          ssh-key: ${{ secrets.PIRN_DEPLOY_KEY }}
      - name: private-treadle
        # read-only deploy key on heedle-ai/treadle
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/treadle
          path: treadle
          ssh-key: ${{ secrets.TREADLE_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: heedle/go.mod
          cache-dependency-path: heedle/go.sum
      - name: gofmt
        working-directory: heedle
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: heedle
        run: go vet ./...
      - name: test
        working-directory: heedle
        run: go test -race ./...
      - name: invariants
        working-directory: heedle
        run: bash .github/invariants.sh
      - name: e2e
        # heedle up against a real Temporal dev server: the temporal CLI,
        # from Temporal's installer.
        working-directory: heedle
        env:
          HEEDLE_E2E: "1"
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          export PATH="$HOME/.temporalio/bin:$PATH"
          temporal --version
          go test -count=1 -v -run 'TestE2E_' . | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestE2E_Up' e2e.log
      - name: release
        # The GoReleaser configuration is valid and builds exactly the
        # supported platforms; nothing is published (release.yml does
        # that, on a v* tag).
        if: matrix.os == 'ubuntu-latest'
        working-directory: heedle
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo goreleaser.tgz https://github.com/goreleaser/goreleaser/releases/download/v2.12.7/goreleaser_Linux_x86_64.tar.gz
          echo "de95c5d1e728e18753c3ddcf02974d63d6432f0a7355a5afa6813971a95a01b8  goreleaser.tgz" | sha256sum -c
          tar -xzf goreleaser.tgz goreleaser
          cd "$GITHUB_WORKSPACE/heedle"
          "$RUNNER_TEMP/goreleaser" check
          "$RUNNER_TEMP/goreleaser" release --snapshot --clean
          got=$(cd dist && ls *.tar.gz | sed -E 's/^heedle_[^_]+_//' | sort | tr '\n' ' ')
          test "$got" = "darwin_arm64.tar.gz linux_amd64.tar.gz linux_arm64.tar.gz " || { echo "built: $got"; exit 1; }
          grep -q 'depends_on formula' dist/homebrew/Casks/heedle.rb
          # The releases are private: every download goes through the
          # cask's token-reading strategy, and the cask is valid Ruby.
          test "$(grep -c 'using: HeedlePrivateReleaseDownloadStrategy' dist/homebrew/Casks/heedle.rb)" = 3
          ruby -c dist/homebrew/Casks/heedle.rb
      - name: cask
        # Homebrew itself loads the cask, in developer mode, where anything
        # deprecated is an error (review 22): a snapshot cask in a local,
        # trusted tap. Nothing is downloaded or published.
        if: matrix.os == 'macos-latest'
        working-directory: heedle
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo goreleaser.tgz https://github.com/goreleaser/goreleaser/releases/download/v2.12.7/goreleaser_Darwin_arm64.tar.gz
          echo "50fff56875b9b981aae6fec1265b081dcb4c8a3a3402656b62d8699b00befb31  goreleaser.tgz" | shasum -a 256 -c
          tar -xzf goreleaser.tgz goreleaser
          cd "$GITHUB_WORKSPACE/heedle"
          "$RUNNER_TEMP/goreleaser" release --snapshot --clean
          brew tap-new --no-git heedle-ai/check
          cp dist/homebrew/Casks/heedle.rb "$(brew --repository heedle-ai/check)/Casks/heedle.rb"
          brew trust --tap heedle-ai/check
          HOMEBREW_DEVELOPER=1 brew info --cask heedle-ai/check/heedle
