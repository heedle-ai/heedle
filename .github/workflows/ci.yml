name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step
    # (the default, bash -e, ignores it).
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: heedle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/loom
          path: loom
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/drawdown
          path: drawdown
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/warp
          path: warp
      - name: sibling-bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
      - name: sibling-reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
      - name: sibling-pirn
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/pirn
          path: pirn
      - name: sibling-treadle
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/treadle
          path: treadle
      - uses: actions/setup-go@v5
        with:
          go-version-file: heedle/go.mod
          cache-dependency-path: heedle/go.sum
      - name: gofmt
        working-directory: heedle
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: heedle
        run: go vet ./...
      - name: test
        working-directory: heedle
        run: go test -race ./...
      - name: invariants
        working-directory: heedle
        run: bash .github/invariants.sh
      - name: e2e
        # heedle up against a real Temporal dev server: the temporal CLI,
        # from Temporal's installer.
        working-directory: heedle
        env:
          HEEDLE_E2E: "1"
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          export PATH="$HOME/.temporalio/bin:$PATH"
          temporal --version
          go test -count=1 -v -run 'TestE2E_' . | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestE2E_Up' e2e.log
      - name: images-pinned
        # images.json pins each image to content; never a tag (roadmap 9.1),
        # the browser-agent image too (roadmap 9.5).
        working-directory: heedle
        run: |
          test "$(grep -cE '"(browser|agent|browserAgent)": "ghcr\.io/heedle-ai/[a-z-]+@sha256:[0-9a-f]{64}"' images.json)" = 3 || { cat images.json; exit 1; }
          if grep -q ':latest' images.json; then exit 1; fi
      - name: e2e-images
        # A fresh install's browse step: heedle up pulls its pinned images
        # anonymously and the worker browses with them (roadmap 9.1). Linux
        # only: GitHub's macOS runners have no Podman.
        if: runner.os == 'Linux'
        working-directory: heedle
        env:
          HEEDLE_E2E_IMAGES: "1"
        run: |
          export PATH="$HOME/.temporalio/bin:$PATH"
          if command -v podman >/dev/null; then :; else
            sudo apt-get update >/dev/null
            sudo apt-get install -y podman >/dev/null
          fi
          # Rootless Podman needs subordinate IDs (reed's image.yml, review 36).
          if grep -q "^$USER:" /etc/subuid && grep -q "^$USER:" /etc/subgid; then :; else
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
            podman system migrate
          fi
          podman --version
          go test -count=1 -v -run 'TestE2EImages_Browse' . | tee e2e-images.log
          if grep -q -- '--- SKIP' e2e-images.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestE2EImages_Browse' e2e-images.log
      - name: e2e-act
        # An act step fills in a two-page form served by the test, in the
        # pinned browser-agent image, with a stand-in Claude; the form gets
        # exactly what was typed and chosen and no other host is reached
        # (roadmap 9.5). Linux only, after e2e-images, which set up Podman.
        if: runner.os == 'Linux'
        working-directory: heedle
        env:
          HEEDLE_E2E_ACT: "1"
        run: |
          go test -count=1 -v -run 'TestE2EAct_FillsAForm' . | tee e2e-act.log
          if grep -q -- '--- SKIP' e2e-act.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestE2EAct_FillsAForm' e2e-act.log
      - name: e2e-course
        # Every form of reed's course (roadmap 9.6) as an act step, with a
        # stand-in Claude that scripts its calls: each form gets what it
        # wants, the password form is refused, the decoy gets nothing.
        # The plumbing, not the intelligence (TestEval_Course scores that).
        if: runner.os == 'Linux'
        working-directory: heedle
        env:
          HEEDLE_E2E_ACT: "1"
        run: |
          go test -count=1 -v -run 'TestE2ECourse_StandIn|TestE2EProfile_LeavesNoValue' . | tee e2e-course.log
          if grep -q -- '--- SKIP' e2e-course.log; then echo 'a test skipped'; exit 1; fi
          for form in conditional contact iframe injection password password-tricks widgets wizard; do
            grep -q -- "--- PASS: TestE2ECourse_StandIn/$form" e2e-course.log
          done
          grep -q -- '--- PASS: TestE2ECourse_StandIn ' e2e-course.log
          grep -q -- '--- PASS: TestE2EProfile_LeavesNoValue ' e2e-course.log
      - name: release
        # The GoReleaser configuration is valid and builds exactly the
        # supported platforms; nothing is published (release.yml does
        # that, on a v* tag).
        if: matrix.os == 'ubuntu-latest'
        working-directory: heedle
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo goreleaser.tgz https://github.com/goreleaser/goreleaser/releases/download/v2.12.7/goreleaser_Linux_x86_64.tar.gz
          echo "de95c5d1e728e18753c3ddcf02974d63d6432f0a7355a5afa6813971a95a01b8  goreleaser.tgz" | sha256sum -c
          tar -xzf goreleaser.tgz goreleaser
          cd "$GITHUB_WORKSPACE/heedle"
          "$RUNNER_TEMP/goreleaser" check
          "$RUNNER_TEMP/goreleaser" release --snapshot --clean
          got=$(cd dist && ls *.tar.gz | sed -E 's/^heedle_[^_]+_//' | sort | tr '\n' ' ')
          test "$got" = "darwin_arm64.tar.gz linux_amd64.tar.gz linux_arm64.tar.gz " || { echo "built: $got"; exit 1; }
          grep -q 'depends_on formula' dist/homebrew/Casks/heedle.rb || { echo 'the cask has no dependencies'; exit 1; }
          # The releases are public: the cask downloads each archive from
          # the release with Homebrew's own download, and is valid Ruby.
          if grep -q 'DownloadStrategy' dist/homebrew/Casks/heedle.rb; then echo 'the cask still has a download strategy'; exit 1; fi
          test "$(grep -c 'url "https://github.com/heedle-ai/heedle/releases/download/' dist/homebrew/Casks/heedle.rb)" = 3 || { echo 'an archive is not downloaded from the public release'; exit 1; }
          ruby -c dist/homebrew/Casks/heedle.rb
      - name: cask
        # Homebrew itself loads the cask, in developer mode, where anything
        # deprecated is an error (review 22): a snapshot cask in a local,
        # trusted tap. Nothing is downloaded or published.
        if: matrix.os == 'macos-latest'
        working-directory: heedle
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo goreleaser.tgz https://github.com/goreleaser/goreleaser/releases/download/v2.12.7/goreleaser_Darwin_arm64.tar.gz
          echo "50fff56875b9b981aae6fec1265b081dcb4c8a3a3402656b62d8699b00befb31  goreleaser.tgz" | shasum -a 256 -c
          tar -xzf goreleaser.tgz goreleaser
          cd "$GITHUB_WORKSPACE/heedle"
          "$RUNNER_TEMP/goreleaser" release --snapshot --clean
          brew tap-new --no-git heedle-ai/check
          mkdir -p "$(brew --repository heedle-ai/check)/Casks"
          cp dist/homebrew/Casks/heedle.rb "$(brew --repository heedle-ai/check)/Casks/heedle.rb"
          brew trust --tap heedle-ai/check
          HOMEBREW_DEVELOPER=1 brew info --cask heedle-ai/check/heedle
